# Dev environment: postgres 16 + server + client dev server.
#   docker compose -f deploy/docker-compose.yml up --build
# Dev-only credentials below; never reuse them outside local development.
name: fireline
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fireline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fireline-dev}
      POSTGRES_DB: fireline
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireline -d fireline"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fireline:${POSTGRES_PASSWORD:-fireline-dev}@postgres:5432/fireline?sslmode=disable
      # Dev-only default (>= 32 bytes). Override via JWT_SECRET in the shell or deploy/.env.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      LISTEN_ADDR: ":8080"
      MIGRATE_ON_START: "true"
      RATE_IP_RPS: ${RATE_IP_RPS:-20}
      RATE_USER_RPS: ${RATE_USER_RPS:-10}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  client:
    build:
      context: ..
      dockerfile: deploy/client-dev.Dockerfile
    volumes:
      - ../client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  client_node_modules:
