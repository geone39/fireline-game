name: simbattle-nightly
# Раз в неделю (пн 03:17 UTC, OPS-8 #136) и по запросу. Полная матрица win-rate ботов-атак (QA-2). Информативна до M3: job не падает из-за win-rate,
# ничего не коммитит; отчёт — артефакт + краткая сводка в job summary.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seeds:
        description: "боёв на ячейку (база × состав)"
        default: "6"
      levels:
        description: "политика уровней: research | parity | one"
        default: "research"
concurrency:
  group: simbattle-nightly
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/simbattle/go.mod
          cache-dependency-path: |
            tools/simbattle/go.sum
            sim/go.sum
            server/go.sum
      - name: Matrix run
        env:
          SEEDS: ${{ github.event.inputs.seeds || '6' }}
          LEVELS: ${{ github.event.inputs.levels || 'research' }}
        run: go -C tools/simbattle run . -seeds "$SEEDS" -levels "$LEVELS" | tee tools/simbattle/stdout.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "### simbattle nightly (seeds=${{ github.event.inputs.seeds || '6' }}, levels=${{ github.event.inputs.levels || 'research' }})"
            echo "Win-rate информативен до M3, job им не гейтится. Полный отчёт — артефакт \`simbattle-report\`."
            if [ -f tools/simbattle/stdout.txt ]; then
              echo '```'
              head -c 60000 tools/simbattle/stdout.txt
              echo '```'
            else
              echo "Прогон не дал вывода."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simbattle-report
          path: |
            tools/simbattle/out/report.md
            tools/simbattle/out/report.json
          if-no-files-found: warn
          retention-days: 30
