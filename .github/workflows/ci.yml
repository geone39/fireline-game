name: ci
# OPS-8 (#136): расход минут Actions. Запуск только на pull_request и push в main (без дублей push ветки + PR);
# job `changes` определяет затронутые области, неактуальные jobs пропускаются (skipped = не провал).
# Push в main и workflow_dispatch всегда гоняют всё.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
# Новый пуш в ту же ветку/PR отменяет устаревший запуск (на main — не отменяем, нужен каждый коммит).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Дешёвый job (≈10 с, биллинг 1 мин): какие области затронул PR. Не-PR события — всё `true`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.out.outputs.code }}
      e2e: ${{ steps.out.outputs.e2e }}
      wasm: ${{ steps.out.outputs.wasm }}
      simbattle: ${{ steps.out.outputs.simbattle }}
    steps:
      - uses: dorny/paths-filter@v3.0.2
        id: f
        if: github.event_name == 'pull_request'
        with:
          # Квантификатор по умолчанию (some): файл подходит, если совпал с ЛЮБЫМ шаблоном области.
          # (`every` требовал совпадения со ВСЕМИ шаблонами и обнулял e2e/wasm/simbattle.)
          filters: |
            code:
              - 'client/**'
              - 'server/**'
              - 'sim/**'
              - 'content/**'
              - 'tools/**'
              - 'deploy/**'
              - 'tests/**'
              - 'art/**'
              - '.github/**'
              - 'Makefile'
            e2e:
              - 'client/**'
              - 'server/**'
              - 'content/**'
              - 'deploy/**'
              - 'tests/**'
              - 'sim/**'
              - '.github/e2e/**'
              - '.github/workflows/ci.yml'
              - 'Makefile'
            wasm:
              - 'sim/**'
              - 'client/sim-wasm/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
              - 'Makefile'
            simbattle:
              - 'tools/simbattle/**'
              - 'sim/**'
              - 'content/**'
              - 'server/svc/raid/**'
              - '.github/workflows/ci.yml'
              - 'Makefile'
      - id: out
        run: |
          for k in code e2e wasm simbattle; do
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              case $k in
                code) v='${{ steps.f.outputs.code }}';;
                e2e) v='${{ steps.f.outputs.e2e }}';;
                wasm) v='${{ steps.f.outputs.wasm }}';;
                simbattle) v='${{ steps.f.outputs.simbattle }}';;
              esac
            else v=true; fi
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"

  # `make check` уже включает server и client (отдельные jobs были дублем и удалены в OPS-8).
  # Docs-only PR: только `make content`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml jsonschema
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: make check
        if: needs.changes.outputs.code == 'true'
        env:
          REQUIRE_DOCKER: "1"
      - run: make content
        if: needs.changes.outputs.code != 'true'
      # next stages (enable as modules land): replay-regression, load smoke (k6)

  # Сборка sim.wasm + паритет G01..G20 native/WASM (node). Параллельно с остальными, основной job не удлиняет.
  wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: sim/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make wasm
      - name: sim.wasm size
        run: |
          raw=$(wc -c < sim/wasm/dist/sim.wasm); gz=$(gzip -9c sim/wasm/dist/sim.wasm | wc -c)
          echo "sim.wasm: $raw bytes, gzip: $gz bytes"
          echo "### sim.wasm: $raw bytes (gzip $gz)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-wasm
          path: |
            sim/wasm/dist/sim.wasm
            sim/wasm/dist/wasm_exec.js
          retention-days: 7

  # Боты-атаки tools/simbattle (отдельный go.mod): vet, gofmt, `test -short` (~25 с). Полная матрица — nightly (simbattle-nightly.yml).
  simbattle:
    needs: changes
    if: needs.changes.outputs.simbattle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/simbattle/go.mod
          cache-dependency-path: |
            tools/simbattle/go.sum
            sim/go.sum
            server/go.sum
      - run: make simbattle

  # Playwright против docker compose (postgres + server + client). Тест known-bugs помечен test.fail — зелёный.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compose up (healthchecks)
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - name: Playwright version
        id: pw
        working-directory: tests/e2e
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Install system deps only (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test -c ../../.github/e2e/playwright.ci.config.ts
        working-directory: tests/e2e
      - name: Compose logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color > compose.log || true
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            tests/e2e/screenshots
            compose.log
          retention-days: 7
      - name: Compose down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
