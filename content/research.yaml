# content/research.yaml — Laboratory. One research at a time. Each node raises max level of an item; time/cost by tier.
# Schema: schema/research.schema.json (CONTENT-6, army-lab.md §2/§5/§11). Level(item) = max(1, max to_level of done nodes of the item).
#   unit | spell | perk — what the node is about (exactly one); perk is structural {key, value} (was the string "key+N").
#   requires — explicit prerequisite node ids (same item, lower to_level); a chain without `requires` is implicit by ascending to_level.
#   soon: true — the node is shown as "coming soon" and cannot be started: its spell has no `level_growth` in troops.yaml (only airstrike and medkit have one, OQ-ARMY-2/SIM-9), the research would change nothing.
# ASSUMPTION (OQ-CONTENT6-3): the nodes added in CONTENT-6 are the first step (to_level 2) of every item; tier follows the existing table (HQ<=2 items tier 1, HQ3..5 tier 2, HQ>=6 tier 3);
#   lab = max(tier floor, item unlock.hq - 1) — the lab reaches level L at about HQ L+1 (validate_content.py checks lab + 1 >= unlock.hq). Higher levels of items are balance's call.
schema: 1
tiers: {1: {fuel: 800, hours: 2}, 2: {fuel: 3000, hours: 8}, 3: {fuel: 12000, hours: 24}, 4: {fuel: 45000, hours: 72}, 5: {fuel: 160000, hours: 168}}
nodes:
